# Peripherals Configuration
peripherals:
  # Shared I2C bus: CST9217 touch, ES8389 codec, ES7210, AXP2101, PCF85063, QMI8658
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 7
        scl: 8
      glitch_count: 7
      enable_internal_pullup: true

  # I2S1 full duplex: ES8389 playback on DOUT, ES7210 capture on DIN
  - name: i2s_audio_out
    type: i2s
    format: "std-out"
    role: master
    config: &i2s_config
      port: 1
      sample_rate_hz: 16000
      clk_src: "I2S_CLK_SRC_DEFAULT"
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: "I2S_SLOT_MODE_STEREO"
      slot_mask: "I2S_STD_SLOT_BOTH"
      ws_width: 16
      pins:
        mclk: 13
        bclk: 12
        ws: 10
        dout: 9
        din: 11

  - name: i2s_audio_in
    type: i2s
    format: "std-in"
    role: master
    config: *i2s_config

  # NS4150B speaker amplifier enable on the adapter board
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 53
      mode: GPIO_MODE_OUTPUT
      pull_up: false
      pull_down: false
      default_level: 0

  # Knob direction switches: turning clockwise pulls GPIO20 low, counter-clockwise
  # pulls GPIO21 low (one pulse per detent). Both edges interrupt so the application
  # can debounce on the level that holds.
  - name: gpio_knob_cw
    type: gpio
    role: io
    config:
      pin: 20
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_ANYEDGE

  - name: gpio_knob_ccw
    type: gpio
    role: io
    config:
      pin: 21
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_ANYEDGE

  # DRV8837 vibration motor: IN1 high with IN2 low drives it, both low is idle
  - name: gpio_haptic_in1
    type: gpio
    role: io
    config:
      pin: 22
      mode: GPIO_MODE_OUTPUT
      pull_up: false
      pull_down: false
      default_level: 0

  - name: gpio_haptic_in2
    type: gpio
    role: io
    config:
      pin: 23
      mode: GPIO_MODE_OUTPUT
      pull_up: false
      pull_down: false
      default_level: 0

  # BOOT and power switches are active-low inputs.
  - name: gpio_boot
    type: gpio
    role: io
    config:
      pin: 35
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_DISABLE

  - name: gpio_power
    type: gpio
    role: io
    config:
      pin: 2
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_DISABLE

  # RTC and IMU interrupt levels are sampled by their diagnostic examples.
  - name: gpio_rtc_int
    type: gpio
    role: io
    config:
      pin: 3
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_DISABLE

  - name: gpio_imu_int1
    type: gpio
    role: io
    config:
      pin: 4
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false
      intr_type: GPIO_INTR_DISABLE

  - name: gpio_imu_int2
    type: gpio
    role: io
    config:
      pin: 5
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false
      intr_type: GPIO_INTR_DISABLE

  # LDO_VO3 powers VDD_MIPI_DPHY
  - name: ldo_mipi
    type: ldo
    config:
      chan_id: 3
      voltage_mv: 2500

  - name: dsi_display
    type: dsi
    config:
      bus_id: 0
      data_lanes: 1
      phy_clk_src: 0
      lane_bit_rate_mbps: 480
