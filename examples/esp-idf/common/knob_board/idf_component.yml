description: Selective ESP Board Manager access for ESP32-P4-Knob-Touch-AMOLED-1.75 examples
version: 1.0.0
targets:
  - esp32p4
dependencies:
  idf: ">=5.5.6"
  espressif/esp_board_manager:
    version: "0.7.4"
    public: true
  # 0.1.5 is the first version with the esp32_p4_knob_touch_amoled_1_75 definition;
  # builds take the newest published version.
  waveshare/waveshare_boards: ">=0.1.5"
  espressif/esp_codec_dev:
    version: "2.0.0-beta5"
    public: true
  espressif/esp_lcd_co5300: "2.0.2"
  waveshare/esp_lcd_touch_cst9217: "2.0.0"
  espressif/esp_lvgl_adapter:
    version: "0.7.3"
    public: true
