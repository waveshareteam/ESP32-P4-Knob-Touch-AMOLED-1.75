description: Board Manager integration, display, audio and storage services for the Brookesia example
version: 1.0.0
targets:
  - esp32p4
dependencies:
  idf: ">=6.0"
  espressif/esp_board_manager:
    version: "0.7.4"
    public: true
  # Board definition for esp32_p4_knob_touch_amoled_1_75.
  waveshare/waveshare_boards: "0.1.5"
  # Board Manager 0.7.4 creates audio_codec devices through the esp_codec_dev 2.0 factory.
  espressif/esp_codec_dev:
    version: "2.0.0-beta5"
    public: true
  # Drivers required by the board definition's display and touch factories.
  espressif/esp_lcd_co5300: "2.0.2"
  waveshare/esp_lcd_touch_cst9217: "2.0.0"
  espressif/esp_lvgl_adapter:
    version: "0.7.3"
    public: true
